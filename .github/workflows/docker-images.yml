name: Build Docker images

# The image set is not listed here. It comes from docker/images.yaml, resolved
# by scripts/ci/images.py, so that a workflow edit is never needed to add an
# image -- only to add a *layer* (see MAX_TIERS in that script).
on:
  push:
    branches:
      - main
      # Any branch whose name contains "docker" builds and scans the images
      # too, and refreshes `edge` with the result. Work on the images is
      # exactly the work that must not wait for a pull request to find out
      # whether the Dockerfiles still build, and a branch build costs nothing
      # when the content hash already exists.
      #
      # `**` matches any character including `/`, so `feature/docker-x` counts.
      # Matching is case-sensitive: name the branch `docker`, not `Docker`.
      #
      # This pattern is paired with the `*docker*` test in the tag step of
      # .github/actions/build-image: this one decides what builds, that one
      # decides what may move `edge`. Narrowing one without the other leaves
      # either a branch that builds but publishes no readable tag, or a rule
      # that can never fire.
      - '**docker**'
    tags: ['v*']

  # A pull request builds only the images it can actually have changed, and
  # `src/`/`apps/` are not among them -- see the `mode` step of `prepare`, which
  # is where the whole "what may this event skip" rule lives. The trigger stays
  # broad on purpose: the decision needs the *diff*, which a `paths:` filter
  # here could only approximate by restating docker/images.yaml's `inputs` in a
  # second place, and would then get wrong for every image at once.
  pull_request:
    branches: [main, master]

  # The refresh run, and the reason the apt snapshot date in the Dockerfiles is
  # no longer something a person maintains.
  #
  # Two independent mechanisms conspire to freeze an image's package set, and
  # both have to be defeated to unfreeze it:
  #
  #   1. this workflow skips a build whose content hash already exists, which
  #      is right -- an unchanged tree should not produce a new image;
  #   2. buildx reuses the apt layer, whose cache key is its own instruction
  #      text plus the parent image, neither of which changes when a security
  #      update lands in the archive.
  #
  # So an image that nobody edits keeps the packages it had on the day its
  # layer was first built, however often CI runs. The scan still runs every
  # time (an unchanged image still acquires CVEs), which is how the gap shows
  # up: findings accumulate against an image no event can rebuild.
  #
  # A weekly run with `force_rebuild` set does both -- skips the existence
  # check and passes a fresh APT_SNAPSHOT -- so `apt-get upgrade` resolves
  # against today's archive.
  #
  # Saturday morning, Central European time: a forced run rebuilds every image
  # from the apt layer down, which is the most expensive thing this repository
  # asks of CI, and at the weekend it competes with nobody's pull request. The
  # week then starts with images that are already refreshed and already
  # scanned.
  #
  # Cron here is UTC and does not follow daylight saving, so 04:00 UTC is 06:00
  # CEST in summer and 05:00 CET in winter. Both are Saturday morning, which is
  # all this needs to be.
  schedule:
    - cron: '0 4 * * 6'

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when the content hash exists, refreshing apt.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      images:    ${{ steps.plan.outputs.images }}     # name -> full record
      retention: ${{ steps.plan.outputs.retention }}
      tier0:     ${{ steps.plan.outputs.tier0 }}
      tier1:     ${{ steps.plan.outputs.tier1 }}
      tier2:     ${{ steps.plan.outputs.tier2 }}
      push:      ${{ steps.mode.outputs.push }}
      force:     ${{ steps.mode.outputs.force }}
    steps:
      # Full history, unlike a plain checkout here before: the `mode` step
      # decides what to build by diffing against the base commit, and a shallow
      # clone does not contain it. Getting this wrong does not break a build --
      # images.py reads an undiffable ref as "everything changed" -- it silently
      # costs the saving, which is the harder failure to notice.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml

      # Ahead of `plan`, because it decides what `plan` is allowed to leave out.
      - id: mode
        env:
          # The commit before the push -- all zeros for a newly created branch,
          # and a commit no longer reachable after a force-push. images.py
          # treats both as "cannot diff" and builds everything.
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A fork PR's GITHUB_TOKEN is downgraded to packages:read.
          echo "push=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"
          # The weekly schedule always refreshes; a manual run asks. Nothing
          # else does, so an ordinary push still gets the cheap behaviour of
          # skipping images whose content has not changed.
          force=${{ github.event_name == 'schedule' || inputs.force_rebuild == true }}
          echo "force=$force" >> "$GITHUB_OUTPUT"

          # Which images this event may skip, expressed as the ref to diff
          # against. Empty means "build every one of them", and that is the
          # answer in every case not named below:
          #
          #   * a forced run exists precisely to rebuild what has *not* changed;
          #   * a `v*` tag publishes `latest` and `vX.Y.Z` from every image;
          #   * a manual run without `force_rebuild` is someone asking for the
          #     full matrix by hand, and should get it.
          #
          # `recipe_only` is the pull-request rule. A change under `src/` or
          # `apps/` then rebuilds no image: build-test.yml compiles those same
          # sources from the same commit, in parallel with this, so assembling
          # the release image would only compile them a second time to prove
          # the same thing. A push to `main` or to a `**docker**` branch does
          # not pass it, so a *published* image always matches its commit.
          since=""
          recipe_only=false
          if [[ "$force" != true && "$GITHUB_REF" != refs/tags/* ]]; then
            case "$GITHUB_EVENT_NAME" in
              pull_request) since="$BASE"; recipe_only=true ;;
              push)         since="$BEFORE" ;;
            esac
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "recipe_only=$recipe_only" >> "$GITHUB_OUTPUT"
          # A job that is skipped says nothing at all, so the reason it was
          # skipped has to be recorded while there is still a step to record it.
          echo "::notice title=Image scope::diffing against ${since:-<nothing: every image builds>}, recipe_only=$recipe_only"

      - id: plan
        env:
          SINCE: ${{ steps.mode.outputs.since }}
          RECIPE_ONLY: ${{ steps.mode.outputs.recipe_only }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$SINCE" ]]; then
            args+=(--changed-since "$SINCE")
          fi
          if [[ "$RECIPE_ONLY" == true ]]; then
            args+=(--recipe-only)
          fi
          python3 scripts/ci/images.py plan --github-output "${args[@]}"

  tier0:
    needs: prepare
    if: needs.prepare.outputs.tier0 != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write    # Trivy SARIF -> the Security tab
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.tier0) }}
    name: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          image: ${{ toJson(matrix.image) }}
          push:  ${{ needs.prepare.outputs.push }}
          force: ${{ needs.prepare.outputs.force }}
          token: ${{ secrets.GITHUB_TOKEN }}

  tier1:
    needs: [prepare, tier0]
    # `!cancelled()` is what keeps this eligible when tier0 was skipped for
    # having no images; without it a skipped dependency skips the dependent.
    if: ${{ !cancelled() && needs.tier0.result != 'failure' && needs.prepare.outputs.tier1 != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.tier1) }}
    name: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          image: ${{ toJson(matrix.image) }}
          push:  ${{ needs.prepare.outputs.push }}
          force: ${{ needs.prepare.outputs.force }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # The runtime images. One tier deeper than dev because they are multi-stage:
  # `FROM dev-cpu AS builder` compiles the presets, and the binaries are copied
  # into base-cpu. This is the only tier whose content depends on src/ and
  # apps/, so it is the only one a C++ change rebuilds.
  tier2:
    needs: [prepare, tier0, tier1]
    if: ${{ !cancelled() && needs.tier0.result != 'failure' && needs.tier1.result != 'failure'
            && needs.prepare.outputs.tier2 != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.tier2) }}
    name: ${{ matrix.image.name }}
    steps:
      # Full history, unlike the tiers above: the builder stage runs
      # `git describe --tags` to stamp the binaries, and a shallow clone has no
      # tags to describe against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-image
        with:
          image: ${{ toJson(matrix.image) }}
          push:  ${{ needs.prepare.outputs.push }}
          force: ${{ needs.prepare.outputs.force }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # The one status worth requiring on a branch protection rule.
  #
  # The tier jobs are the wrong thing to require, for two reasons that both
  # became true with the narrowing above. Their names come from the matrix, so
  # they change whenever docker/images.yaml does; and a job skipped for having
  # nothing to build reports **no status at all**, so a required check by that
  # name would simply never arrive and the pull request would wait for ever.
  #
  # This job always runs and fails only when a tier really failed. `skipped` is
  # a pass: it is the answer this whole change exists to produce.
  gate:
    name: Images
    needs: [prepare, tier0, tier1, tier2]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: >-
            prepare:${{ needs.prepare.result }} tier0:${{ needs.tier0.result }}
            tier1:${{ needs.tier1.result }} tier2:${{ needs.tier2.result }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=""
          for entry in $RESULTS; do
            case "${entry#*:}" in
              success|skipped) ;;
              *) failed="$failed ${entry}" ;;
            esac
          done
          if [[ -n "$failed" ]]; then
            echo "::error title=Image build failed::${failed# }"
            exit 1
          fi

  # Deletes what this build superseded: previous `edge` manifests, now
  # untagged, in the per-image packages, and hash-/sha- versions past the keep
  # window in buildcache. The policy is docker/images.yaml's `retention:` block.
  #
  # A matrix job would be wrong here. Deletion must have a single writer, or
  # several jobs decide "this is the sixth newest, drop it" from different
  # snapshots of one package.
  prune:
    needs: [prepare, tier0, tier1, tier2]
    # Only after a build that published, and only if nothing failed: pruning
    # against a half-built matrix expires an old image while its replacement
    # does not exist. `!cancelled()` keeps this eligible when a tier was
    # skipped for having no images. A pull request never prunes -- it
    # supersedes nothing.
    #
    # Nor does an event that built nothing, which is now the common case: with
    # every tier empty there is no new manifest, so nothing has been superseded
    # and the whole job would be an API sweep that deletes by age what it was
    # never meant to delete by age.
    if: ${{ !cancelled() && github.event_name != 'pull_request'
            && needs.prepare.outputs.push == 'true'
            && (needs.prepare.outputs.tier0 != '[]'
                || needs.prepare.outputs.tier1 != '[]'
                || needs.prepare.outputs.tier2 != '[]')
            && needs.tier0.result != 'failure' && needs.tier1.result != 'failure'
            && needs.tier2.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      # The names come from the same resolver the build used, so this job
      # contains no image name and no rule of its own. Without --delete the
      # script only reports, which is what it does when run by hand.
      - run: python3 scripts/ci/prune_packages.py --delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
