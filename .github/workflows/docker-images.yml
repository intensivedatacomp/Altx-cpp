name: Build Docker images

# The image set is not listed here. It comes from docker/images.yaml, resolved
# by scripts/ci/images.py, so that a workflow edit is never needed to add an
# image -- only to add a *layer* (see MAX_TIERS in that script).
on:
  push:
    branches:
      - main
      # Any branch whose name contains "docker" builds and scans the images
      # too, and refreshes `edge` with the result. Work on the images is
      # exactly the work that must not wait for a pull request to find out
      # whether the Dockerfiles still build, and a branch build costs nothing
      # when the content hash already exists.
      #
      # `**` matches any character including `/`, so `feature/docker-x` counts.
      # Matching is case-sensitive: name the branch `docker`, not `Docker`.
      #
      # This pattern is paired with the `*docker*` test in the tag step of
      # .github/actions/build-image: this one decides what builds, that one
      # decides what may move `edge`. Narrowing one without the other leaves
      # either a branch that builds but publishes no readable tag, or a rule
      # that can never fire.
      - '**docker**'
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      images:    ${{ steps.plan.outputs.images }}     # name -> full record
      retention: ${{ steps.plan.outputs.retention }}
      tier0:     ${{ steps.plan.outputs.tier0 }}
      tier1:     ${{ steps.plan.outputs.tier1 }}
      push:      ${{ steps.mode.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - id: plan
        run: python3 scripts/ci/images.py plan --github-output
      - id: mode
        run: |
          # A fork PR's GITHUB_TOKEN is downgraded to packages:read.
          echo "push=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"

  tier0:
    needs: prepare
    if: needs.prepare.outputs.tier0 != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write    # Trivy SARIF -> the Security tab
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.tier0) }}
    name: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          image: ${{ toJson(matrix.image) }}
          push:  ${{ needs.prepare.outputs.push }}
          token: ${{ secrets.GITHUB_TOKEN }}

  tier1:
    needs: [prepare, tier0]
    # `!cancelled()` is what keeps this eligible when tier0 was skipped for
    # having no images; without it a skipped dependency skips the dependent.
    if: ${{ !cancelled() && needs.tier0.result != 'failure' && needs.prepare.outputs.tier1 != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.tier1) }}
    name: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          image: ${{ toJson(matrix.image) }}
          push:  ${{ needs.prepare.outputs.push }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Deletes what this build superseded: previous `edge` manifests, now
  # untagged, in the per-image packages, and hash-/sha- versions past the keep
  # window in buildcache. The policy is docker/images.yaml's `retention:` block.
  #
  # A matrix job would be wrong here. Deletion must have a single writer, or
  # several jobs decide "this is the sixth newest, drop it" from different
  # snapshots of one package.
  prune:
    needs: [prepare, tier0, tier1]
    # Only after a build that published, and only if nothing failed: pruning
    # against a half-built matrix expires an old image while its replacement
    # does not exist. `!cancelled()` keeps this eligible when a tier was
    # skipped for having no images. A pull request never prunes -- it
    # supersedes nothing.
    if: ${{ !cancelled() && github.event_name != 'pull_request'
            && needs.prepare.outputs.push == 'true'
            && needs.tier0.result != 'failure' && needs.tier1.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      # The names come from the same resolver the build used, so this job
      # contains no image name and no rule of its own. Without --delete the
      # script only reports, which is what it does when run by hand.
      - run: python3 scripts/ci/prune_packages.py --delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
