name: Pre-commit

# The same hooks a developer runs locally, over the whole tree rather than the
# changed files. `pre-commit install` is per-clone and can be skipped with
# `--no-verify`, so this job is what makes the checks a property of the
# repository rather than of each contributor's setup.
#
# No container. Every hook that could disagree with a developer's machine
# supplies its own tool at a pinned version -- `clang-format` is `language:
# python` and installs the pinned `clang-format` wheel, so it never touches the
# `clang-format-18` in dev-cpu -- which means a plain runner formats byte for
# byte the same as the container. Running this inside dev-cpu would also make
# linting wait for the image build, and deadlock on a pull request that changes
# a Dockerfile.
on:
  push:
    # Every branch. Linting is cheap and the feedback is worth more the earlier
    # it arrives -- waiting for a pull request to be opened before finding out
    # that a file is unformatted is the whole failure this job exists to avoid.
    #
    # `'**'` matches names containing `/`, so `feature/x` counts. Tags are
    # deliberately excluded: a tag points at a commit that was already linted
    # when it was pushed as a branch.
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch name in both events -- `head_ref` for a pull request,
# `ref_name` for a push -- so a rapid series of pushes leaves one run standing
# rather than a queue of superseded ones.
#
# A push to a branch that already has a pull request open does run this twice,
# and that is accepted rather than deduplicated. The two are not the same check:
# `pull_request` runs against the merge of head into base, which is what will
# actually land, while `push` runs against the branch as written. Collapsing
# them into one concurrency group would have whichever started second cancel the
# first, and a cancelled run reads as a failed required check.
concurrency:
  group: pre-commit-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Hook environments are a dozen virtualenvs plus a Go toolchain for
      # actionlint -- minutes of setup on a cold runner. They are keyed by hook
      # repository and rev, so `.pre-commit-config.yaml` is the exact cache key:
      # bump a rev and the affected environment is rebuilt. `restore-keys` makes
      # that partial rather than total, since every unchanged hook in an older
      # cache is still valid.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-py3.12-

      - run: pip install --quiet pre-commit

      # --show-diff-on-failure prints what the formatters would have written, so
      # a failure here is a patch to apply rather than a puzzle to reproduce.
      - name: Run the commit-stage hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          # `no-commit-to-branch` protects `main` from direct commits. It is a
          # property of the developer's working branch, and it fails by
          # construction in the one place it cannot mean anything: the push
          # event *on* main, after the pull request that carried the change has
          # already been reviewed and merged.
          SKIP: no-commit-to-branch

      # The pre-push tier is empty today; Doxygen's documentation-coverage check
      # goes here, because it needs the whole tree but no configured build. It
      # is run separately because `default_stages: [pre-commit]` means the step
      # above does not pick it up -- and a check only a local `git push` enforces
      # is one that `--no-verify` disables for good.
      - name: Run the push-stage hooks
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure --color=always
