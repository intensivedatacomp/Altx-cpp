name: Docs

# Doxygen: build the site on every pull request, publish it from `main` and
# from release tags.
#
# The split is the point. `WARN_AS_ERROR = FAIL_ON_WARNINGS` in
# docs/Doxyfile.in makes "every function and every argument is documented" a
# gate rather than an aspiration, and a gate that first runs after a merge is
# one that breaks `main`. The pre-push hook catches this locally, but only for
# somebody who installed it and did not reach for `--no-verify`, so the same
# check runs here where it cannot be skipped.
on:
  push:
    # `main` and release tags only. Unlike build-test.yml, this is not run on
    # every branch: the documentation build proves nothing a pull request will
    # not prove a moment later, and the pre-push hook already stands between a
    # broken doc comment and a push.
    branches: [main]
    tags: ['v*']
    # The coverage job in build-test.yml commits a badge to `main`. Nothing
    # about the documentation changes when it does.
    paths-ignore: ['.badges/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Inside a container job the runner falls back to `sh` -- dash on Ubuntu --
# even though the image has bash on PATH, and `set -o pipefail` then fails with
# a message that names neither the shell nor the cause. See build-test.yml,
# which documents the symptom in full.
defaults:
  run:
    shell: bash

# Per ref, so that pushing twice to a pull request does not leave two builds
# racing. The *deployment* is serialised separately, on the `pages` group in
# the deploy job: a single workflow-level `pages` group would additionally
# queue every pull request's build behind every other one, for a resource none
# of them touch.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # A separate job because a container image has to be named before the job
  # that runs in it starts, so it cannot be resolved by a step inside it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: image
        uses: ./.github/actions/resolve-image
        with:
          image: dev-cpu
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    # Doxygen and graphviz live in the development image and nowhere else, so
    # the site is generated by the same doxygen the pre-push hook runs. A bare
    # runner's doxygen is a different version, and the settings this depends on
    # -- `FAIL_ON_WARNINGS` above all -- are version-sensitive.
    container:
      image: ${{ needs.prepare.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image runs as `non_root` (uid 1000) and the workspace belongs to
      # the runner's user (uid 1001), so the build directory would be
      # unwritable. Root inside a throwaway container costs nothing.
      options: --user 0
    steps:
      # Full history: PROJECT_NUMBER comes from `git describe --tags`, and a
      # shallow clone has no tags to describe against. A site stamped with the
      # wrong version is worse than one stamped `unknown`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # git refuses a repository owned by another user, and this job is root in
      # a checkout the runner made. Without it the build succeeds and publishes
      # a site labelled `unknown`; see cmake/GitVersion.cmake, which warns.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake --preset cpu-omp-release -DALTX_ENABLE_DOCS=ON

      # Doxygen writes its warnings to stderr, so a failure here is readable in
      # this log rather than in an artefact; see WARN_LOGFILE in
      # docs/Doxyfile.in.
      - name: Build
        run: cmake --build --preset cpu-omp-release --target docs

      # `upload-pages-artifact`, not `upload-artifact`: `deploy-pages` deploys
      # one specific artefact, named `github-pages`, in the specific shape this
      # action produces. It also takes a directory, not a glob.
      #
      # No `!cancelled()` guard: a failed doxygen run leaves no html directory,
      # and uploading would then fail with a missing-path error on top of the
      # real one.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/cpu-omp-release/docs/html

  deploy:
    needs: build
    # A pull request builds but must not publish; `main`, a release tag, and a
    # manual run from `main` publish. Spelled out by ref rather than by event
    # so that a `workflow_dispatch` from a feature branch cannot put that
    # branch's documentation on the site.
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Not in a container, and with no checkout: `deploy-pages` needs the OIDC
    # id-token to prove where the deployment came from, and it deploys an
    # artefact rather than a working tree.
    permissions:
      pages: write        # create the deployment
      id-token: write     # prove it originates here
    # GitHub Pages accepts one deployment at a time. `cancel-in-progress:
    # false` -- deliberately the opposite of the workflow-level group above --
    # because cancelling midway can leave the site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
